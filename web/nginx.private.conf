# 私有访问：Web/API 仅允许 loopback 与 Docker 网关（SSH 隧道经 DNAT 后来源为网关）；飞书回调保持公网。
server {
  listen 80;

  auth_basic 'NextCareer';
  auth_basic_user_file /etc/nginx/.htpasswd;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 50m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;

  location = /index.html {
    allow 127.0.0.1;
    allow 172.18.0.1;
    allow ::1;
    deny all;
    add_header Cache-Control 'no-cache' always;
    try_files $uri =404;
  }

  location /assets/ {
    allow 127.0.0.1;
    allow 172.18.0.1;
    allow ::1;
    deny all;
    add_header Cache-Control 'public, immutable' always;
    expires 1y;
  }

  location /api/ {
    allow 127.0.0.1;
    allow 172.18.0.1;
    allow ::1;
    deny all;
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
  }

  location = /feishu/callback {
    auth_basic off;
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    allow 127.0.0.1;
    allow 172.18.0.1;
    allow ::1;
    deny all;
    try_files $uri /index.html;
  }
}
