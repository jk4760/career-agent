services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-nextcareer}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-nextcareer}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20
    # 不暴露端口：数据库仅 compose 内网可达（验收清单第 8 条）

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${DB_USER:-nextcareer}:${DB_PASSWORD}@db:5432/${DB_NAME:-nextcareer}
      UPLOAD_DIR: /var/lib/nextcareer/uploads
      # M4：LLM 评分与飞书推送（只从 .env 读，缺省为空 → 评分降级规则分、推送报未配置）
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      MOONSHOT_BASE_URL: ${MOONSHOT_BASE_URL:-}
      MOONSHOT_MODEL: ${MOONSHOT_MODEL:-}
      AI_DAILY_BUDGET_CNY: ${AI_DAILY_BUDGET_CNY:-2}
      AI_BUDGET_ENFORCE: ${AI_BUDGET_ENFORCE:-false}
      AI_CHAT_ENABLED: ${AI_CHAT_ENABLED:-false}
      AI_PRICE_KIMI_K3_1_PRO_INPUT_CNY_PER_MTOK: ${AI_PRICE_KIMI_K3_1_PRO_INPUT_CNY_PER_MTOK:-}
      AI_PRICE_KIMI_K3_1_PRO_OUTPUT_CNY_PER_MTOK: ${AI_PRICE_KIMI_K3_1_PRO_OUTPUT_CNY_PER_MTOK:-}
      AI_PRICE_KIMI_K3_1_PRO_CACHE_HIT_CNY_PER_MTOK: ${AI_PRICE_KIMI_K3_1_PRO_CACHE_HIT_CNY_PER_MTOK:-}
      AI_PRICE_KIMI_K3_1_PRO_CACHE_WRITE_5M_CNY_PER_MTOK: ${AI_PRICE_KIMI_K3_1_PRO_CACHE_WRITE_5M_CNY_PER_MTOK:-}
      AI_PRICE_KIMI_K3_1_PRO_CACHE_WRITE_1H_CNY_PER_MTOK: ${AI_PRICE_KIMI_K3_1_PRO_CACHE_WRITE_1H_CNY_PER_MTOK:-}
      AI_PRICE_KIMI_K3_1_PRO_HIGHSPEED_INPUT_CNY_PER_MTOK: ${AI_PRICE_KIMI_K3_1_PRO_HIGHSPEED_INPUT_CNY_PER_MTOK:-}
      AI_PRICE_KIMI_K3_1_PRO_HIGHSPEED_OUTPUT_CNY_PER_MTOK: ${AI_PRICE_KIMI_K3_1_PRO_HIGHSPEED_OUTPUT_CNY_PER_MTOK:-}
      AI_PRICE_KIMI_K3_1_PRO_HIGHSPEED_CACHE_HIT_CNY_PER_MTOK: ${AI_PRICE_KIMI_K3_1_PRO_HIGHSPEED_CACHE_HIT_CNY_PER_MTOK:-}
      AI_PRICE_KIMI_K3_1_PRO_HIGHSPEED_CACHE_WRITE_5M_CNY_PER_MTOK: ${AI_PRICE_KIMI_K3_1_PRO_HIGHSPEED_CACHE_WRITE_5M_CNY_PER_MTOK:-}
      AI_PRICE_KIMI_K3_1_PRO_HIGHSPEED_CACHE_WRITE_1H_CNY_PER_MTOK: ${AI_PRICE_KIMI_K3_1_PRO_HIGHSPEED_CACHE_WRITE_1H_CNY_PER_MTOK:-}
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
      FEISHU_WEBHOOK_SECRET: ${FEISHU_WEBHOOK_SECRET:-}
      # M4.5：飞书自建应用（卡片内交互）；缺省时发送回退 webhook、回调路由 503
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_VERIFICATION_TOKEN: ${FEISHU_VERIFICATION_TOKEN:-}
      FEISHU_ENCRYPT_KEY: ${FEISHU_ENCRYPT_KEY:-}
      FEISHU_CHAT_ID: ${FEISHU_CHAT_ID:-}
      FEISHU_SEND_CHANNEL: ${FEISHU_SEND_CHANNEL:-webhook}
      FEISHU_ALERT_CHANNEL: ${FEISHU_ALERT_CHANNEL:-webhook}
    volumes:
      - uploads:/var/lib/nextcareer/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      # 仅绑定 loopback：ops 脚本与调试用（/internal 无公网面，nginx 仍只转 /api）
      - '127.0.0.1:3001:3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/api/jobs').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  collector:
    # M3 采集器：手动触发，不默认启动
    # 用法：docker compose --profile manual run --rm collector
    build:
      context: ./collector
    profiles: ['manual']
    environment:
      API_BASE: http://api:3001
    volumes:
      - ./collector/config.yaml:/app/config.yaml:ro
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-80}:80'
    environment:
      AUTH_USER: ${AUTH_USER:?AUTH_USER is required}
      AUTH_PASS: ${AUTH_PASS:?AUTH_PASS is required}
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
