# NextCareer 采集器配置（入库，非密钥）

rate_limit:
  search_interval_sec: 2      # 搜索请求间隔（≥2s）
  detail_interval_sec: 4      # 详情页请求间隔（3–5s）
  detail_cap_per_run: 100     # 单 run 详情页请求封顶

liepin:
  cities: ["020"]             # 020=上海（城市码以 ai-job-search-cn 文档为准：北京 010、上海 020、深圳 050090）
  page_size: 40
  max_pages_per_keyword: 3    # 每个关键词最多翻 3 页，控制搜索请求量

